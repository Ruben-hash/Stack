networks:
  monitoring:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
  alloy-data:


services:
  # Loki - Stockage et analyse de logs
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml
      - ./loki/rules:/loki/rules
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  # Alloy - Collecteur de logs
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - alloy-data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

  # Grafana - Visualisation
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    restart: unless-stopped

  # Alertmanager - Gestion des alertes
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    restart: unless-stopped

  # SNMP Notifier - Conversion alertes → SNMP
  snmp-notifier:
    image: maxwo/snmp-notifier:latest
    container_name: snmp-notifier
    ports:
      - "9464:9464"
    volumes:
      - ./snmp_notifier/snmp_notifier.yaml:/etc/snmp_notifier/snmp_notifier.yml:ro
    environment:
      - SNMP_NOTIFIER_COMMUNITY=public
      - SNMP_NOTIFIER_SNMP_DESTINATION=snmptrapd:162
    networks:
      - monitoring
    depends_on:
      - snmptrapd
    restart: unless-stopped

  # SNMPtrapd - Réception des traps
  snmptrapd:
    build:
      context: ./snmptrapd
      dockerfile: Dockerfile
    container_name: snmptrapd
    ports:
      - "162:162/udp"
    networks:
      - monitoring
    restart: unless-stopped

  alertmanagerdashboard:
    image: ghcr.io/prymitive/karma:latest
    container_name: karma
    environment:
      ALERTMANAGER_URI: http://alertmanager:9093
    ports:
      - "8080:8080"
    networks:
      - monitoring
    restart: unless-stopped

  # MODIFIÉ : générateur de fausses alertes réalistes (plusieurs services simulés)
  log-generator:
    image: python:3.12-alpine
    container_name: log-generator
    volumes:
      - ./log_generator.py:/app/log_generator.py:ro
    command: ["python", "-u", "/app/log_generator.py"]
    environment:
      RATE: "1"            # lignes par seconde
      ERROR_RATIO: "0.15"  # 15 % de warn/error
      INCIDENT_EVERY: "60" # un incident en cascade toutes les 60 s
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - alloy
  log-analyzer:
    image: python:3.12-alpine
    container_name: log-analyzer
    working_dir: /app
    volumes:
      - ./analyse_logs.py:/app/analyse_logs.py:ro
      - ./reports:/app/reports
    environment:
      LOKI_URL: http://loki:3100
      LLM_URL: http://host.docker.internal:1235/v1
      LLM_MODEL: phi-4-mini-reasoning
      TZ: Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    profiles: ["tools"]     # ne démarre pas avec "docker compose up -d"
    command: ["python", "-u", "analyse_logs.py", "--since", "1h"]